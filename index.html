<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='23' rx='5' fill='%232F5BEA'/%3E%3Crect x='3' y='6' width='26' height='7' rx='3' fill='%2315171C'/%3E%3C/svg%3E">
<title>Julian's Work Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#15171C; --muted:#646A7A; --faint:#9AA0AE;
  --line:#E1E3E9; --accent:#2F5BEA; --accent-soft:#E6ECFD; --today:#2F5BEA;
  --p0:#2F5BEA; --p0s:#E6ECFD; --p1:#0E8A6A; --p1s:#DDF3EC; --p2:#C0521F; --p2s:#FBE8DD;
  --p3:#8A4FD1; --p3s:#EFE6FA; --p4:#B7880B; --p4s:#F8F0D6; --p5:#C2335E; --p5s:#FBE2EA;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1115; --surface:#171A20; --surface-2:#1C2028; --ink:#ECEEF2; --muted:#9BA1B0; --faint:#6A7080;
    --line:#2A2F39; --accent:#7D9BFF; --accent-soft:#1E2A4D; --today:#7D9BFF;
    --p0:#8FA8FF; --p0s:#1F2A4A; --p1:#4FD1A8; --p1s:#123329; --p2:#F2966A; --p2s:#3A2317;
    --p3:#BE95F5; --p3s:#2C2040; --p4:#E8C255; --p4s:#352C12; --p5:#F27FA3; --p5s:#3C1A26;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1115; --surface:#171A20; --surface-2:#1C2028; --ink:#ECEEF2; --muted:#9BA1B0; --faint:#6A7080;
  --line:#2A2F39; --accent:#7D9BFF; --accent-soft:#1E2A4D; --today:#7D9BFF;
  --p0:#8FA8FF; --p0s:#1F2A4A; --p1:#4FD1A8; --p1s:#123329; --p2:#F2966A; --p2s:#3A2317;
  --p3:#BE95F5; --p3s:#2C2040; --p4:#E8C255; --p4s:#352C12; --p5:#F27FA3; --p5s:#3C1A26;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:28px 56px;display:grid;gap:22px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:2px 0 0;font-size:clamp(26px,4vw,34px);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.stats{display:flex;gap:22px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats b{display:block;font-family:var(--sans);font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:22px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:6px}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--faint)}
.btn:focus-visible,.day:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.icon{width:32px;padding:6px 0;text-align:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{font:inherit;font-size:13px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
.day{position:relative;text-align:left;font:inherit;color:inherit;background:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:108px;padding:8px 8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.grid .day:nth-child(7n){border-right:0}
.grid.week .day{min-height:260px}
.day:hover{background:var(--surface-2)}
.day.out .num{color:var(--faint)}
.day.sel{background:var(--accent-soft)}
.num{font-family:var(--mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;align-self:flex-start}
.day.today .num{background:var(--today);color:var(--surface)}
.chips{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip{display:block;font-size:12px;font-weight:600;line-height:1.3;padding:3px 7px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c);background:var(--cs)}
.chip .n{font-family:var(--mono);font-weight:400;opacity:.8;margin-left:4px}
.week .chip{white-space:normal}
.teaser{font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:620px){
  .day{min-height:64px;padding:5px 4px}
  .grid.week .day{min-height:140px}
  .chip{font-size:0;padding:0;height:6px;border-radius:3px}
  .chip .n{display:none}
  .teaser{display:none}
  .dow div{padding:8px 4px;font-size:10px}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 20px 24px;display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:960px){.panel{position:static}}
.panel-date small{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel-date h3{margin:2px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.proj{display:grid;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.proj-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.proj-head h4{margin:0;font-size:17px;font-weight:600}
.src{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.proj-sum{margin:0;color:var(--muted);font-size:14px}
.sec h5{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.sec ul{margin:0;padding-left:18px;display:grid;gap:6px}
.sec li{font-size:14px;line-height:1.5;max-width:65ch}
.sec li::marker{color:var(--faint)}
.empty{color:var(--muted);font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.left{display:grid;gap:22px;min-width:0}
.weekly{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px 22px;display:grid;gap:14px}
.weekly-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.weekly-head small{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.weekly-head h2{margin:2px 0 0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.mail{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:hidden}
.mail-row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline;flex-wrap:wrap}
.mail-row span{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:none;width:58px}
.mail-row b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mail-body{margin:0;padding:14px;font-family:var(--sans);font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.copied{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.day,.btn{transition:background-color .12s,border-color .12s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <small>Daily work log</small>
      <h1>What we shipped</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="layout">
    <div class="left">
    <section class="cal" aria-label="Calendar">
      <div class="cal-head">
        <h2 id="calTitle">Loading…</h2>
        <div class="nav">
          <div class="seg" role="group" aria-label="View">
            <button type="button" id="vWeek" aria-pressed="true">Week</button>
            <button type="button" id="vMonth" aria-pressed="false">Month</button>
          </div>
          <button type="button" class="btn icon" id="prev" aria-label="Previous">‹</button>
          <button type="button" class="btn" id="todayBtn">Today</button>
          <button type="button" class="btn icon" id="next" aria-label="Next">›</button>
        </div>
      </div>
      <div class="dow" id="dow"></div>
      <div class="grid week" id="grid"></div>
    </section>

    <section class="weekly" aria-label="Weekly summary">
      <div class="weekly-head">
        <div><small>Weekly summary · ready to email</small><h2 id="wkTitle">This week</h2></div>
        <div class="nav"><span class="copied" id="copied" aria-live="polite"></span><button type="button" class="btn primary" id="copyBtn">Copy email</button></div>
      </div>
      <div class="mail">
        <div class="mail-row"><span>Subject</span><b id="wkSubject"></b></div>
        <pre class="mail-body" id="wkBody"></pre>
      </div>
    </section>
    </div>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <p class="note" id="note">Loading entries…</p>
</div>

<script>
(function(){
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const state = { entries:{}, weeks:{}, view:"week", cursor:today(), selected:today(), loaded:false };
  const projColor = {};

  function today(){ const d=new Date(); d.setHours(12,0,0,0); return d; }
  function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parse(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d,12); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function startOfWeek(d){ return addDays(d,-d.getDay()); }
  function colorFor(name){
    if(!(name in projColor)){
      let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))>>>0;
      projColor[name]=h%6;
    }
    const i=projColor[name]; return {c:`var(--p${i})`,cs:`var(--p${i}s)`};
  }
  function el(tag,attrs,...kids){
    const e=document.createElement(tag);
    for(const [k,v] of Object.entries(attrs||{})){
      if(k==="class") e.className=v; else if(k==="style") e.setAttribute("style",v); else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
    }
    for(const kid of kids){ if(kid==null) continue; e.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
    return e;
  }
  function itemCount(entry){
    let n=0; for(const p of entry.projects||[]) for(const s of p.sections||[]) n+=(s.items||[]).length; return n;
  }

  function renderStats(){
    const ws=startOfWeek(state.cursor), we=addDays(ws,6);
    let days=0, items=0; const projects=new Set();
    for(let d=ws; d<=we; d=addDays(d,1)){
      const e=state.entries[key(d)]; if(!e) continue;
      days++; items+=itemCount(e); (e.projects||[]).forEach(p=>projects.add(p.name));
    }
    const s=document.getElementById("stats"); s.replaceChildren(
      el("div",null,el("b",null,days),"days logged"),
      el("div",null,el("b",null,items),"changes"),
      el("div",null,el("b",null,projects.size),projects.size===1?"project":"projects"));
    s.setAttribute("aria-label","This week");
  }

  function renderCal(){
    const c=state.cursor, t=key(today()), sel=key(state.selected);
    let start, count;
    if(state.view==="week"){
      start=startOfWeek(c); count=7;
      const end=addDays(start,6);
      document.getElementById("calTitle").textContent =
        start.getMonth()===end.getMonth()
          ? `${MONTHS[start.getMonth()].slice(0,3)} ${start.getDate()} – ${end.getDate()}, ${end.getFullYear()}`
          : `${MONTHS[start.getMonth()].slice(0,3)} ${start.getDate()} – ${MONTHS[end.getMonth()].slice(0,3)} ${end.getDate()}, ${end.getFullYear()}`;
    } else {
      const first=new Date(c.getFullYear(),c.getMonth(),1,12);
      start=startOfWeek(first);
      const last=new Date(c.getFullYear(),c.getMonth()+1,0,12);
      count=Math.ceil((last-start)/864e5+1); count=Math.ceil(count/7)*7;
      document.getElementById("calTitle").textContent=`${MONTHS[c.getMonth()]} ${c.getFullYear()}`;
    }
    document.getElementById("dow").replaceChildren(...DOW.map(d=>el("div",null,d)));
    const grid=document.getElementById("grid");
    grid.className="grid "+state.view;
    const cells=[];
    for(let i=0;i<count;i++){
      const d=addDays(start,i), k=key(d), e=state.entries[k];
      const cls=["day"]; if(k===t) cls.push("today"); if(k===sel) cls.push("sel");
      if(state.view==="month" && d.getMonth()!==c.getMonth()) cls.push("out");
      const chips=el("div",{class:"chips"});
      if(e) for(const p of e.projects||[]){
        const col=colorFor(p.name); let n=0; (p.sections||[]).forEach(s=>n+=(s.items||[]).length);
        chips.append(el("span",{class:"chip",style:`--c:${col.c};--cs:${col.cs}`},p.name,n?el("span",{class:"n"},n):null));
      }
      const label=`${DOW[d.getDay()]} ${MONTHS[d.getMonth()]} ${d.getDate()}${e?", "+(e.projects||[]).map(p=>p.name).join(", "):", nothing logged"}`;
      cells.push(el("button",{type:"button",class:cls.join(" "),"aria-label":label,"aria-pressed":String(k===sel),onclick:()=>{state.selected=d; render();}},
        el("span",{class:"num"},d.getDate()), chips,
        (state.view==="week" && e && e.summary)? el("span",{class:"teaser"},e.summary):null));
    }
    grid.replaceChildren(...cells);
  }

  function renderPanel(){
    const d=state.selected, e=state.entries[key(d)], p=document.getElementById("panel");
    const head=el("div",{class:"panel-date"},el("small",null,DOW[d.getDay()]+(key(d)===key(today())?" · Today":"")),
      el("h3",null,`${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`));
    if(!e){
      p.replaceChildren(head, el("p",{class:"empty"}, state.loaded?"Nothing logged for this day yet.":"Loading…"));
      return;
    }
    const blocks=[head];
    if(e.summary) blocks.push(el("p",{class:"proj-sum"},e.summary));
    for(const pr of e.projects||[]){
      const col=colorFor(pr.name);
      const box=el("div",{class:"proj",style:`--c:${col.c};--cs:${col.cs}`},
        el("div",{class:"proj-head"},el("span",{class:"dot"}),el("h4",null,pr.name)),
        pr.source?el("div",{class:"src"},pr.source):null);
      for(const s of pr.sections||[]){
        box.append(el("div",{class:"sec"}, s.title?el("h5",null,s.title):null,
          el("ul",null,...(s.items||[]).map(it=>el("li",null,it)))));
      }
      blocks.push(box);
    }
    p.replaceChildren(...blocks);
  }

  function weekStart(){ return startOfWeek(state.view==="week"?state.cursor:state.selected); }
  function fmt(d){ return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; }
  function autoSummary(ws){
    const byProject=new Map();
    for(let i=0;i<7;i++){
      const e=state.entries[key(addDays(ws,i))]; if(!e) continue;
      for(const p of e.projects||[]){
        if(!byProject.has(p.name)) byProject.set(p.name,[]);
        const list=byProject.get(p.name);
        for(const s of p.sections||[]) for(const it of s.items||[]) if(!list.includes(it)) list.push(it);
      }
    }
    if(!byProject.size) return "";
    const parts=["Hi,","","Here's a summary of what I worked on this week:",""];
    for(const [name,items] of byProject){ parts.push(name); items.forEach(it=>parts.push("• "+it)); parts.push(""); }
    parts.push("Thanks,","Julian");
    return parts.join("\n");
  }
  function renderWeekly(){
    const ws=weekStart(), we=addDays(ws,6), w=state.weeks[key(ws)];
    const range=`${fmt(ws)} – ${fmt(we)}, ${we.getFullYear()}`;
    document.getElementById("wkTitle").textContent=range;
    const body=(w&&w.body)||autoSummary(ws);
    document.getElementById("wkSubject").textContent=(w&&w.subject)||`Weekly summary · ${range}`;
    document.getElementById("wkBody").textContent=body||(state.loaded?"Nothing logged this week yet.":"Loading…");
    document.getElementById("copyBtn").disabled=!body;
  }
  document.getElementById("copyBtn").onclick=()=>{
    const subject=document.getElementById("wkSubject").textContent, bodyEl=document.getElementById("wkBody");
    const text=`Subject: ${subject}\n\n${bodyEl.textContent}`, msg=document.getElementById("copied");
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(bodyEl); const s=getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent="Selected. Press Ctrl+C or ⌘C to copy."; };
    try{ navigator.clipboard.writeText(text).then(()=>{ msg.textContent="Copied"; setTimeout(()=>msg.textContent="",2500); },fallback); }catch(_){ fallback(); }
  };

  function render(){ renderCal(); renderPanel(); renderStats(); renderWeekly(); }

  document.getElementById("vWeek").onclick=()=>{state.view="week"; state.cursor=state.selected; syncSeg(); render();};
  document.getElementById("vMonth").onclick=()=>{state.view="month"; state.cursor=state.selected; syncSeg(); render();};
  function syncSeg(){
    document.getElementById("vWeek").setAttribute("aria-pressed",String(state.view==="week"));
    document.getElementById("vMonth").setAttribute("aria-pressed",String(state.view==="month"));
    try{ localStorage.setItem("worklog.view",state.view); }catch(_){}
  }
  function shift(dir){
    const c=state.cursor;
    state.cursor = state.view==="week" ? addDays(c,7*dir) : new Date(c.getFullYear(),c.getMonth()+dir,1,12);
    render();
  }
  document.getElementById("prev").onclick=()=>shift(-1);
  document.getElementById("next").onclick=()=>shift(1);
  document.getElementById("todayBtn").onclick=()=>{state.cursor=today(); state.selected=today(); render();};

  try{ const v=localStorage.getItem("worklog.view"); if(v==="week"||v==="month") state.view=v; }catch(_){}
  syncSeg(); render();

  const note=document.getElementById("note");
  fetch("data.json",{cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(data=>{
    state.entries=data.days||{}; state.weeks=data.weeks||{}; state.loaded=true;
    const keys=Object.keys(state.entries).sort();
    note.textContent = keys.length ? `${keys.length} ${keys.length===1?"day":"days"} logged` : "No entries yet.";
    if(keys.length && !state.entries[key(state.selected)]){ state.selected=parse(keys[keys.length-1]); state.cursor=state.selected; }
    render();
  }).catch(()=>{ state.loaded=true; note.textContent="The log could not load. Reload the page to try again."; render(); });
})();
</script>
</body>
</html>
